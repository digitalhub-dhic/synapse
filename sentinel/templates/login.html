<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher sign-in · Synapse Sentinel</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202c24; background: #f3f7f4; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1rem; }
    main { width: min(100%, 25rem); box-sizing: border-box; padding: 2rem; background: #fff; border: 1px solid #dce7df; border-radius: 1rem; box-shadow: 0 1rem 3rem #1835221a; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { line-height: 1.5; color: #536359; }
    label { display: block; margin: 1.25rem 0 .4rem; font-weight: 650; }
    input { width: 100%; box-sizing: border-box; min-height: 2.8rem; padding: .65rem .75rem; border: 1px solid #9aa99f; border-radius: .45rem; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid #147a3b; outline-offset: 2px; }
    button { width: 100%; min-height: 2.8rem; margin-top: 1rem; border: 0; border-radius: .45rem; background: #167a3b; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .error { margin-top: 1rem; padding: .75rem; border-left: 4px solid #b42318; background: #fff1f0; color: #7a271a; }
    .hint { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Teacher sign-in</h1>
    <p>Sign in to manage the Sentinel dashboard and classroom controls.</p>
    {% if error %}<div id="login-error" class="error" role="alert" aria-live="assertive">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <label for="password">Teacher-console password</label>
      <input id="password" name="password" type="password" required maxlength="1024" autocomplete="current-password" aria-describedby="password-hint{% if error %} login-error{% endif %}" autofocus>
      <span id="password-hint" class="hint">This password is stored locally as a salted verifier.</span>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
